backend:
  name: github
  repo: Ukja2/Ukja2.github.io
  branch: main
  base_url: https://sveltia-cms-auth.qwe02085.workers.dev
  auth_endpoint: auth

media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: "posts"
    label: "Posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD" }
      # 카테고리 종류가 바뀌면 src/lib/categories.js와 함께 여기도 맞춰서 수정하세요.
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        options: ["Network", "Server", "Dev"]
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
